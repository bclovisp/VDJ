<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDJ</title>
<meta name="theme-color" content="#E8F0E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="VDJ">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F0E1; --ink:#15301F; --muted:#4A6553; --card:#FFFFFF; --line:#CFDCC8;
  --gold:#FFD23F; --good:#1C8A41; --bad:#CF3A26; --btn:#15301F; --btn-ink:#FFFFFF;
  --bronze:#C98A4B; --silver:#A3AFBA; --goldt:#E7B416; --none:#D7E1D2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1C14; --ink:#E4EFDF; --muted:#9AB3A2; --card:#15291D; --line:#26432F; --good:#5FD782; --bad:#FF7B67; --btn:#FFD23F; --btn-ink:#15301F; --none:#26432F; } }
:root[data-theme="dark"]{ --bg:#0D1C14; --ink:#E4EFDF; --muted:#9AB3A2; --card:#15291D; --line:#26432F; --good:#5FD782; --bad:#FF7B67; --btn:#FFD23F; --btn-ink:#15301F; --none:#26432F; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding:10px 14px 28px}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{font-weight:700;font-size:1.3rem;letter-spacing:.04em;flex:1;margin:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 12px;min-height:38px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* home */
.hero{margin:6px 0 16px}
.motto{display:flex;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.motto li{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-weight:700;font-size:1.08rem}
.motto li span{display:block;font-size:1.5rem;line-height:1.2}
.big{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:1.25rem;cursor:pointer}
.big.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-size:1.1rem;min-height:52px}
h2{font-size:1.15rem;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--none);border-radius:14px;padding:10px 10px 10px 11px;text-align:left;cursor:pointer;min-height:92px}
.card .ic{font-size:1.5rem;line-height:1.1}
.card .nm{font-weight:700;line-height:1.2}
.card .tr{font-size:.85rem;color:var(--muted)}
.card.t1{border-left-color:var(--bronze)} .card.t2{border-left-color:var(--silver)} .card.t3{border-left-color:var(--goldt)}
.card.soon{opacity:.55;cursor:default}

/* play */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--none)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--gold)}
.step{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;margin:2px 0 6px}
.q{font-size:1.3rem;line-height:1.3;margin:0 2px 10px;font-weight:700}
.pitch-wrap{border-radius:16px;overflow:hidden;border:3px solid #2A7A46;background:#3A9A5B}
svg.pitch{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.legend{display:flex;justify-content:center;gap:16px;margin:8px 0 0;color:var(--muted);font-size:.95rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.answers{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.08rem;text-align:left;cursor:pointer}
.opt .ic{font-size:1.45rem;width:1.8rem;text-align:center}
.opt[disabled]{cursor:default}
.opt.locked{color:var(--muted)}
.opt.locked::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--gold);animation:fill var(--lock,2s) linear forwards}
@keyframes fill{to{width:100%}}
.opt.right{border-color:var(--good);background:color-mix(in srgb, var(--good) 14%, var(--card))}
.opt.wrong{border-color:var(--bad);opacity:.6}
.hint{color:var(--muted);text-align:center;margin:10px 0 0}
.msg{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.msg .v{font-weight:700;font-size:1.25rem;margin:0 0 4px}
.msg .v.good{color:var(--good)} .msg .v.bad{color:var(--bad)}
.msg p{margin:0}
.msg .look{font-weight:700}
.nextbtn{margin-top:12px;position:relative;overflow:hidden}
.nextbtn.locked{opacity:.55}
.nextbtn.locked::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--gold);animation:fill var(--lock,4s) linear forwards}

/* end + detail */
.end h1{font-size:1.5rem;margin:6px 0}
.end ul{padding-left:0;list-style:none;margin:10px 0}
.end li{padding:6px 0;border-bottom:1px solid var(--line)}
.mission{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--gold);border-radius:14px;padding:12px 14px;margin:14px 0}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:4px 0 8px;font-size:1.35rem}
.sheet h4{margin:12px 0 2px;font-size:1rem;color:var(--muted)}
.sheet p{margin:0}
.row{display:flex;gap:10px;margin-top:14px}
.row .big{flex:1}
@media (prefers-reduced-motion: reduce){ .opt.locked::after,.nextbtn.locked::after{animation-duration:.01s} }
</style>
</head>

/* ---------- pitch drawing ---------- */

function label(g, x, y, text, anchor){

  el("rect",{x:0,y:-10,width:370,height:570,fill:"#3A9A5B"},svg);
  var mk=el("g",{fill:"none",stroke:"rgba(255,255,255,.85)","stroke-width":2},svg);
  el("rect",{x:6,y:6,width:358,height:538},mk); el("line",{x1:6,y1:275,x2:364,y2:275},mk); el("circle",{cx:185,cy:275,r:50},mk);

  });
  /* "You" tag, placed where nothing else is */

  var fits=function(c){ var X=mpos[0]+c[0], Y=mpos[1]+c[1]; return Y>y0+2 && Y+19<y0+298 && X>4 && X+w<366; };

    var q=p.dec.spots[k], c=el("circle",{cx:q[0],cy:q[1],r:26,fill:"transparent","pointer-events":"all","data-spot":k,style:S.locked?"":"cursor:pointer"},svg);

/* ---------- screens ---------- */

  sh.appendChild(h("p",{"class":"hint"},esc(t().tier[tierOf(n)])+". "+esc(t().progress(n))+"."));
  var row=h("div",{"class":"row"});
  row.appendChild(h("button",{"class":"big ghost",onclick:function(){ speak(s.name+". "+s.looks+" "+s.todo); }},"🔊 "+esc(t().listen)));
  row.appendChild(h("button",{"class":"big",onclick:function(){ stopSpeech(); ov.remove(); }},esc(t().close)));
  sh.appendChild(row); ov.appendChild(sh); document.body.appendChild(ov);
}
function renderPlay(){
  var S=R.s, p=cur(), sit=t().sit[p.sit];
  var bar=h("div",{"class":"bar"});
  bar.appendChild(h("button",{"class":"back",onclick:goHome},"‹ "+esc(t().home)));
  var dots=h("div",{"class":"dots","aria-hidden":"true"});
  R.items.forEach(function(_,i){ var r=R.res[i]; dots.appendChild(h("i",{"class":i===R.i?"now":(r?(r.name&&r.dec?"ok":"no"):"")})); });
  bar.appendChild(dots); app.appendChild(bar);
  var deciding = S.step==="decide"||S.step==="result";
  app.appendChild(h("span",{"class":"step"}, deciding ? "🤔 "+esc(st().decide) : "👀 "+esc(st().see)));
  app.appendChild(h("h1",{"class":"q",id:"q"}, esc(deciding ? t().q[p.dec.q] : t().q1)));
  var pw=h("div",{"class":"pitch-wrap"}); pw.appendChild(drawPitch(p,S,true)); app.appendChild(pw);
  app.appendChild(legend());
  var ans=h("div",{"class":"answers"});
  if(!deciding){
    S.names.forEach(function(k){
      var cls="opt", dis=S.locked||S.step!=="name";
      if(S.wrong.indexOf(k)>=0){ cls+=" wrong"; dis=true; }
      if((S.step==="named"||S.step==="revealed") && k===p.sit) cls+=" right";
      if(S.locked && S.step==="name") cls+=" locked";
      var b=h("button",{"class":cls,"data-name":k,style:"--lock:"+S.lockMs+"ms",onclick:function(){ pickName(k); }},'<span class="ic">'+ICON[k]+'</span><span>'+esc(t().sit[k].name)+'</span>');
      if(dis) b.setAttribute("disabled",""); ans.appendChild(b);
    });
  } else if(p.dec.t==="btn"){
    S.opts.forEach(function(k){
      var cls="opt", dis=S.locked||S.step!=="decide";
      if(S.step==="result"){ if(k===p.dec.ok) cls+=" right"; else if(k===S.dec) cls+=" wrong"; }
      if(S.locked && S.step==="decide") cls+=" locked";
      var b=h("button",{"class":cls,"data-opt":k,style:"--lock:"+S.lockMs+"ms",onclick:function(){ pickDec(k); }},'<span>'+esc(t().opt[k])+'</span>');
      if(dis) b.setAttribute("disabled",""); ans.appendChild(b);
    });
  } else if(S.step==="decide"){
    ans.appendChild(h("p",{"class":"hint"}, esc(t().tapSpot)));
  }
  app.appendChild(ans);
  if(S.msg && !deciding){
    var m=h("div",{"class":"msg","aria-live":"polite"}); m.appendChild(h("p",{"class":"look"},esc(S.msg))); app.appendChild(m);
  }
  if(S.step==="revealed"){
    var cb=h("button",{"class":"big nextbtn"+(S.locked?" locked":""),style:"--lock:"+S.lockMs+"ms",id:"contBtn",onclick:toDecide},esc(t().cont));
    if(S.locked) cb.setAttribute("disabled",""); app.appendChild(cb);
  }
  if(S.step==="result"){
    var mm=h("div",{"class":"msg","aria-live":"polite"});
    mm.appendChild(h("p",{"class":"v "+(S.decOk?"good":"bad")},(S.decOk?"✅ ":"✋ ")+esc(S.decOk?t().good:t().bad)));
    mm.appendChild(h("p",{},esc(t().ex[p.id]))); app.appendChild(mm);
    var nb=h("button",{"class":"big nextbtn"+(S.locked?" locked":""),style:"--lock:"+S.lockMs+"ms",id:"nextBtn",onclick:nextPic},esc(t().next));
    if(S.locked) nb.setAttribute("disabled",""); app.appendChild(nb);
  }
}
function renderEnd(){
  var n=R.res.filter(function(r){ return r.name; }).length, box=h("section",{"class":"end"});
  box.appendChild(h("h1",{},"🏁 "+esc(t().roundDone)));
  box.appendChild(h("p",{},esc(t().score(n,R.res.length))));
  var ul=h("ul"); R.res.forEach(function(r){ ul.appendChild(h("li",{},(r.name?"✅ ":"➖ ")+ICON[r.sit]+" "+esc(t().sit[r.sit].name))); }); box.appendChild(ul);
  var seen={}, names=[]; R.res.forEach(function(r){ if(!seen[r.sit]){ seen[r.sit]=1; names.push(ICON[r.sit]+" "+t().sit[r.sit].name); } });
  box.appendChild(h("div",{"class":"mission"},"<p><b>⚽ "+esc(st().play)+"</b></p><p>"+esc(st().mission)+"</p><p>"+names.map(esc).join("<br>")+"</p>"));
  var row=h("div",{"class":"row"});
  row.appendChild(h("button",{"class":"big ghost",onclick:goHome},esc(t().album)));
  row.appendChild(h("button",{"class":"big",id:"againBtn",onclick:newRound},esc(t().again)));
  box.appendChild(row); app.appendChild(box);
}
function render(){
  document.documentElement.lang=store.lang; document.title="VDJ";
  app.innerHTML=""; app.appendChild(header());
  if(screen==="home") renderHome();
  else if(screen==="play" && R && R.s) renderPlay();
  else if(screen==="end" && R) renderEnd();
  else { screen="home"; renderHome(); }
}
render();

if("serviceWorker" in navigator && /github\.io$|^localhost$|^127\./.test(location.hostname)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
window.VDJ={ get R(){ return R; }, get screen(){ return screen; }, store:store, PICS:PICS, mirrorPic:mirrorPic,
  pickName:pickName, pickDec:pickDec, next:nextPic, cont:toDecide, newRound:newRound,
  forceRound:function(ids, mirror){ buildRound(ids.map(function(id){ var p=PICS.filter(function(q){ return q.id===id; })[0]; return mirror?mirrorPic(p):clone(p); })); } };
})();

</script>
