<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDJ</title>
<meta name="theme-color" content="#E8F0E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VDJ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F0E1; --ink:#15301F; --muted:#4A6553; --card:#FFFFFF; --line:#CFDCC8;
  --gold:#FFD23F; --good:#1C8A41; --bad:#CF3A26; --btn:#15301F; --btn-ink:#FFFFFF;
  --bronze:#C98A4B; --silver:#A3AFBA; --goldt:#E7B416; --none:#D7E1D2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1C14; --ink:#E4EFDF; --muted:#9AB3A2; --card:#15291D; --line:#26432F; --good:#5FD782; --bad:#FF7B67; --btn:#FFD23F; --btn-ink:#15301F; --none:#26432F; } }
:root[data-theme="dark"]{ --bg:#0D1C14; --ink:#E4EFDF; --muted:#9AB3A2; --card:#15291D; --line:#26432F; --good:#5FD782; --bad:#FF7B67; --btn:#FFD23F; --btn-ink:#15301F; --none:#26432F; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding:10px 14px 28px}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{font-weight:700;font-size:1.3rem;letter-spacing:.04em;flex:1;margin:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 12px;min-height:38px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* home */
.hero{margin:6px 0 16px}
.motto{display:flex;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.motto li{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-weight:700;font-size:1.08rem}
.motto li span{display:block;font-size:1.5rem;line-height:1.2}
.big{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:1.25rem;cursor:pointer}
.big.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-size:1.1rem;min-height:52px}
h2{font-size:1.15rem;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--none);border-radius:14px;padding:10px 10px 10px 11px;text-align:left;cursor:pointer;min-height:92px}
.card .ic{font-size:1.5rem;line-height:1.1}
.card .nm{font-weight:700;line-height:1.2}
.card .tr{font-size:.85rem;color:var(--muted)}
.card.t1{border-left-color:var(--bronze)} .card.t2{border-left-color:var(--silver)} .card.t3{border-left-color:var(--goldt)}
.card.soon{opacity:.55;cursor:default}

/* play */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--none)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--gold)}
.step{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;margin:2px 0 6px}
.q{font-size:1.3rem;line-height:1.3;margin:0 2px 10px;font-weight:700}
.pitch-wrap{border-radius:16px;overflow:hidden;border:3px solid #2A7A46;background:#3A9A5B}
svg.pitch{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.legend{display:flex;justify-content:center;gap:16px;margin:8px 0 0;color:var(--muted);font-size:.95rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.answers{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.08rem;text-align:left;cursor:pointer}
.opt .ic{font-size:1.45rem;width:1.8rem;text-align:center}
.opt[disabled]{cursor:default}
.opt.locked{color:var(--muted)}
.opt.locked::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--gold);animation:fill var(--lock,2s) linear forwards}
@keyframes fill{to{width:100%}}
.opt.right{border-color:var(--good);background:color-mix(in srgb, var(--good) 14%, var(--card))}
.opt.wrong{border-color:var(--bad);opacity:.6}
.hint{color:var(--muted);text-align:center;margin:10px 0 0}
.msg{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.msg .v{font-weight:700;font-size:1.25rem;margin:0 0 4px}
.msg .v.good{color:var(--good)} .msg .v.bad{color:var(--bad)}
.msg p{margin:0}
.msg .look{font-weight:700}
.nextbtn{margin-top:12px;position:relative;overflow:hidden}
.nextbtn.locked{opacity:.55}
.nextbtn.locked::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--gold);animation:fill var(--lock,4s) linear forwards}

/* end + detail */
.end h1{font-size:1.5rem;margin:6px 0}
.end ul{padding-left:0;list-style:none;margin:10px 0}
.end li{padding:6px 0;border-bottom:1px solid var(--line)}
.mission{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--gold);border-radius:14px;padding:12px 14px;margin:14px 0}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:4px 0 8px;font-size:1.35rem}
.sheet h4{margin:12px 0 2px;font-size:1rem;color:var(--muted)}
.sheet p{margin:0}
.row{display:flex;gap:10px;margin-top:14px}
.row .big{flex:1}
/* football touches */
.logo{display:inline-flex;align-items:center;gap:8px}
.logo .ball{flex:none}
.play{display:flex;align-items:center;justify-content:center;gap:12px}
.play .ball{transition:transform .3s}
.play:active .ball{transform:rotate(90deg)}
.motto li span .ball{display:inline-block;vertical-align:middle}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}55%{transform:translateY(-7px) rotate(25deg)}}
.score{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.sline{display:flex;align-items:center;gap:8px;font-size:1.1rem}
.big-star{color:var(--goldt);font-size:1.5rem;line-height:1}
.meter{height:10px;border-radius:5px;background:var(--none);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#FFD23F,#E7B416);border-radius:5px}
.small{font-size:.88rem;color:var(--muted);margin:2px 0 0}
h3.group{font-size:1rem;color:var(--muted);margin:16px 0 6px}
.list{display:flex;flex-direction:column;gap:8px}
.row-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px;cursor:pointer}
.row-card .ic{font-size:1.45rem;width:1.8rem;text-align:center;flex:none}
.row-card .nm{flex:1;font-weight:700;line-height:1.25}
.row-card .st{flex:none;font-size:1.25rem;letter-spacing:1px;white-space:nowrap}
.row-card .st em{font-style:normal;font-size:.85rem;color:var(--muted);letter-spacing:0}
.row-card.soon{opacity:.55;cursor:default}
.row-card.full{border-color:var(--goldt);box-shadow:inset 0 0 0 1px var(--goldt)}
.on{color:var(--goldt)} .off{color:var(--none)}
.stars-l{font-size:1.4rem;margin:-4px 0 8px}
.msg.why{border-left:6px solid var(--bad)} .msg.ok{border-left:6px solid var(--good)}
.burst{position:fixed;left:50%;top:55%;width:0;height:0;pointer-events:none;z-index:20}
.burst span{position:absolute;left:-13px;top:-13px;animation:fly 1.1s ease-out forwards;opacity:0}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.win{text-align:center;position:relative;z-index:2;padding-top:10px}
.win .trophy{font-size:5rem;line-height:1.1;animation:bounce 1.6s ease-in-out infinite}
.win h1{font-size:1.6rem;margin:8px 0}
.win p{font-size:1.15rem;margin:0 0 18px}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.rain span{position:absolute;top:-40px;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
canvas.fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
@media (prefers-reduced-motion: reduce){ .opt.locked::after,.nextbtn.locked::after{animation-duration:.01s} .bounce,.win .trophy,.rain span{animation:none} }
</style>
</head>

<script>

/* ---------- helpers ---------- */

function mirrorPic(p){

}

/* a football, drawn once */
var BALL = (function(){
  var c=50, out='<circle cx="50" cy="50" r="46" fill="#fff" stroke="#15301F" stroke-width="3"/>';

  }

/* ---------- voice ---------- */
var voices=[];

if("speechSynthesis" in window){ loadVoices(); try{ window.speechSynthesis.onvoiceschanged=loadVoices; }catch(e){} }
function speak(text){
  return new Promise(function(res){
    if(!store.voice || FAST || !("speechSynthesis" in window)) return res();

      window.speechSynthesis.cancel();

      var exact=voices.filter(function(v){ return lc(v)===u.lang.toLowerCase(); }), near=voices.filter(function(v){ return lc(v).indexOf(u.lang.slice(0,2).toLowerCase())===0; });

/* ---------- round ---------- */

function newRound(){
  var picks=PICS, ok=false, n=Math.min(6, PICS.length);
  for(var a=0; a<300 && !ok; a++){
    picks=shuffle(PICS).slice(0,n); ok=true;
    for(var i=2;i<picks.length;i++) if(picks[i].sit===picks[i-1].sit && picks[i].sit===picks[i-2].sit) ok=false;
    var sits={}; picks.forEach(function(p){ sits[p.sit]=1; });

}
function cur(){ return R.items[R.i]; }

function lock(ms, sp){

}
function pickName(k){

}

}

/* ---------- pitch drawing ---------- */

  var p0=[a[0],a[1]], p1=[a[2],a[3]], d=dist(p0,p1)||1, ux=(p1[0]-p0[0])/d, uy=(p1[1]-p0[1])/d, s0, s1;

  var ln=el("line",{x1:s0[0],y1:s0[1],x2:s1[0],y2:s1[1],stroke:col,"stroke-width":color==="b"?3:4,"stroke-linecap":"round","marker-end":"url(#"+mk+")"},g);
  if(dash || color==="b") ln.setAttribute("stroke-dasharray", color==="b"?"4 5":"8 7");
}
function cross(g, q){
  var s=6, d="M"+(q[0]-s)+" "+(q[1]-s)+"L"+(q[0]+s)+" "+(q[1]+s)+"M"+(q[0]+s)+" "+(q[1]-s)+"L"+(q[0]-s)+" "+(q[1]+s);

}

function drawOutcome(over, marks, p, k, good){

    var ch=p.dec.spots[k];

/* ---------- win page with fireworks ---------- */
var fw=null;
function stopFireworks(){ if(fw){ cancelAnimationFrame(fw.raf); fw.cv.remove(); fw=null; } }
function startFireworks(){
  stopFireworks(); if(REDUCE) return;
  var cv=h("canvas",{"class":"fw","aria-hidden":"true"}); document.body.appendChild(cv);
  var ctx=cv.getContext("2d"), parts=[], cols=["#FFD23F","#ffffff","#5FD782","#E53935","#FFE45C"], last=0, dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  function burst(){ var x=cv.width*(0.15+Math.random()*0.7), y=cv.height*(0.12+Math.random()*0.35), c=cols[Math.floor(Math.random()*cols.length)];
    for(var i=0;i<46;i++){ var a=Math.random()*Math.PI*2, s=(1.5+Math.random()*3.5)*dpr; parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:60+Math.random()*30,c:c}); } }
  function frame(ts){
    if(!fw) return;
    if(ts-last>650){ burst(); last=ts; }
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(q){ return q.life>0; });
    parts.forEach(function(q){ q.x+=q.vx; q.y+=q.vy; q.vy+=0.05*dpr; q.life--; ctx.globalAlpha=Math.max(0,q.life/90); ctx.fillStyle=q.c; ctx.beginPath(); ctx.arc(q.x,q.y,2.6*dpr,0,7); ctx.fill(); });
    ctx.globalAlpha=1; fw.raf=requestAnimationFrame(frame);
  }
  fw={cv:cv, raf:0}; fw.raf=requestAnimationFrame(frame);
}
